<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Vua Tiếng Việt - Ma Trận Chữ Cái</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <!-- Google Fonts: Be Vietnam Pro -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@500;600;700;800;900&display=swap" rel="stylesheet" />
  <!-- Canvas Confetti -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.2/dist/confetti.browser.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
      font-family: 'Be Vietnam Pro', sans-serif;
    }

    body {
      background-color: #070d1f;
      color: #f8fafc;
      user-select: none;
    }

    /* Nền lưới gameshow hiện đại */
    .bg-grid {
      background-image: 
        radial-gradient(circle at 50% 30%, rgba(56, 189, 248, 0.16) 0%, transparent 55%),
        radial-gradient(circle at 85% 80%, rgba(250, 204, 21, 0.12) 0%, transparent 45%),
        linear-gradient(to right, rgba(255, 255, 255, 0.03) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
      background-size: 100% 100%, 100% 100%, 44px 44px, 44px 44px;
    }

    /* Hiệu ứng kính mờ */
    .glass-panel {
      background: rgba(15, 23, 42, 0.72);
      backdrop-filter: blur(14px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      box-shadow: 0 18px 40px rgba(0, 0, 0, 0.45);
    }

    /* Thẻ chữ cái 3D Gameshow */
    .letter-tile {
      background: linear-gradient(145deg, #1e3370 0%, #111d42 100%);
      border: 2px solid rgba(56, 189, 248, 0.55);
      box-shadow: 
        0 8px 0 #091026,
        0 14px 22px rgba(0, 0, 0, 0.5),
        inset 0 2px 4px rgba(255, 255, 255, 0.25);
      transition: all 0.45s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .letter-tile:hover {
      transform: translateY(-4px) scale(1.03);
      border-color: #38bdf8;
    }

    /* Trạng thái khi mở đáp án */
    .letter-tile.solved {
      background: linear-gradient(145deg, #fbbf24 0%, #d97706 100%);
      border-color: #fef08a;
      color: #0f172a;
      box-shadow: 
        0 8px 0 #92400e,
        0 0 32px rgba(250, 204, 21, 0.65),
        inset 0 2px 6px rgba(255, 255, 255, 0.6);
      transform: scale(1.04);
    }

    /* Nút bấm nổi 3D */
    .btn-3d {
      transition: transform 0.12s ease, filter 0.15s ease;
    }
    .btn-3d:active {
      transform: translateY(3px);
    }

    /* Hiệu ứng xuất hiện thẻ */
    @keyframes popIn {
      0% {
        opacity: 0;
        transform: scale(0.65) translateY(14px);
      }
      100% {
        opacity: 1;
        transform: scale(1) translateY(0);
      }
    }
    .animate-pop-in {
      animation: popIn 0.38s cubic-bezier(0.22, 1, 0.36, 1) both;
    }

    /* Ánh sáng hào quang tiêu đề */
    .title-glow {
      text-shadow: 0 0 28px rgba(250, 204, 21, 0.45), 0 4px 12px rgba(0, 0, 0, 0.6);
    }

    /* Nút chọn nhanh câu hỏi */
    .q-pill.active {
      background: linear-gradient(135deg, #fbbf24 0%, #f59e0b 100%);
      color: #0f172a;
      border-color: #fef08a;
      box-shadow: 0 0 18px rgba(250, 204, 21, 0.5);
    }
  </style>
</head>
<body class="bg-grid flex flex-col justify-between h-screen w-screen overflow-hidden">

  <!-- THANH ĐIỀU KHIỂN TRÊN CÙNG (HEADER) -->
  <header class="w-full px-4 sm:px-8 py-3 flex items-center justify-between border-b border-white/10 bg-slate-950/60 backdrop-blur-md z-30 shrink-0">
    <div class="flex items-center gap-3">
      <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-amber-400 to-orange-500 flex items-center justify-center text-slate-950 font-black text-xl shadow-lg">
        <i class="fa-solid fa-crown"></i>
      </div>
      <h1 class="font-black text-lg sm:text-xl tracking-wide text-amber-400">VUA TIẾNG VIỆT</h1>
    </div>

    <!-- Thanh chuyển nhanh Câu 1 -> Câu 5 -->
    <nav id="questionNav" class="flex items-center gap-1.5 sm:gap-2 bg-slate-900/80 p-1.5 rounded-2xl border border-white/15">
      <!-- Render tự động 5 nút câu hỏi -->
    </nav>

    <!-- Nút tiện ích: Âm thanh, Toàn màn hình -->
    <div class="flex items-center gap-2 sm:gap-3">
      <button id="btnSound" onclick="toggleSound()" title="Bật/Tắt âm thanh" class="glass-panel hover:bg-white/15 text-cyan-300 px-3 py-2 rounded-xl text-sm font-semibold transition flex items-center gap-1.5 cursor-pointer">
        <i id="soundIcon" class="fa-solid fa-volume-high"></i>
        <span id="soundText" class="hidden md:inline">Âm thanh</span>
      </button>

      <button id="btnFullscreen" onclick="toggleFullscreen()" title="Chế độ toàn màn hình máy chiếu" class="glass-panel hover:bg-white/15 text-amber-300 px-3 py-2 rounded-xl text-sm font-semibold transition flex items-center gap-1.5 cursor-pointer">
        <i id="fullscreenIcon" class="fa-solid fa-expand"></i>
        <span class="hidden md:inline">Toàn màn hình</span>
      </button>
    </div>
  </header>

  <!-- NỘI DUNG CHÍNH: SÂN KHẤU CÂU HỎI GỌN TRONG 1 KHUNG HÌNH -->
  <main class="flex-grow flex items-center justify-center px-4 sm:px-8 py-4 overflow-hidden">
    <section id="gameScreen" class="w-full max-w-6xl mx-auto h-full flex flex-col justify-between gap-4">

      <!-- KHUNG HIỂN THỊ CHỮ CÁI 3D -->
      <div class="glass-panel rounded-3xl p-4 sm:p-8 flex-grow flex flex-col items-center justify-center relative overflow-hidden">
        <!-- Nhãn số thứ tự câu hỏi & số chữ cái -->
        <div class="flex flex-wrap items-center justify-center gap-3 mb-5 sm:mb-8">
          <span id="badgeQuestionNum" class="px-5 py-1.5 rounded-full bg-amber-400/20 border border-amber-400/50 text-amber-300 font-black text-base sm:text-xl tracking-wide shadow-[0_0_15px_rgba(250,204,21,0.2)]">
            CÂU 1 / 5
          </span>
          <span id="badgeLetterCount" class="px-4 py-1.5 rounded-full bg-cyan-500/15 border border-cyan-400/40 text-cyan-200 font-bold text-sm sm:text-lg">
            Từ khóa gồm 7 chữ cái
          </span>
        </div>

        <!-- Khung chứa các thẻ chữ cái 3D luôn nằm trên 1 hàng ngang gọn gàng -->
        <div id="lettersContainer" class="w-full flex flex-nowrap items-center justify-center gap-2 sm:gap-3.5 md:gap-4 my-2 px-2">
          <!-- Thẻ chữ cái render động -->
        </div>

        <!-- Khu vực hiển thị Gợi ý & Thông báo đáp án -->
        <div class="mt-6 min-h-[64px] flex flex-col items-center justify-center text-center max-w-3xl">
          <div id="hintBox" class="hidden px-6 py-2.5 rounded-2xl bg-cyan-500/20 border border-cyan-400/50 text-cyan-100 text-base sm:text-xl font-bold animate-pop-in shadow-[0_0_20px_rgba(56,189,248,0.25)]">
            <i class="fa-solid fa-lightbulb text-amber-300 mr-2"></i>
            <span id="hintText">Gợi ý sẽ hiện ở đây</span>
          </div>
          <div id="solvedBanner" class="hidden mt-3 text-amber-300 font-black text-xl sm:text-2xl tracking-wide animate-pop-in title-glow">
            <i class="fa-solid fa-circle-check text-emerald-400 mr-2"></i> CHÍNH XÁC! XIN CHÚC MỪNG!
          </div>
        </div>
      </div>

      <!-- THANH NÚT ĐIỀU KHIỂN DƯỚI CÙNG -->
      <div class="flex flex-wrap items-center justify-between gap-2.5 sm:gap-4 shrink-0 pb-1">
        <!-- Nút Câu trước -->
        <button id="btnPrev" onclick="prevQuestion()" class="btn-3d glass-panel hover:bg-white/15 disabled:opacity-35 disabled:pointer-events-none text-white font-bold px-4 sm:px-6 py-3.5 rounded-2xl flex items-center gap-2 text-sm sm:text-base cursor-pointer">
          <i class="fa-solid fa-arrow-left"></i>
          <span>Câu trước</span>
        </button>

        <!-- Nhóm 3 nút chức năng trung tâm -->
        <div class="flex flex-wrap items-center justify-center gap-2.5 sm:gap-4">
          <button id="btnShuffle" onclick="reshuffleCurrent()" class="btn-3d bg-slate-800 hover:bg-slate-700 border border-cyan-400/40 text-cyan-200 font-extrabold px-5 py-3.5 rounded-2xl flex items-center gap-2 text-sm sm:text-base shadow-[0_5px_0_#0f172a] cursor-pointer">
            <i class="fa-solid fa-shuffle text-cyan-400"></i>
            <span>XÁO TRỘN LẠI</span>
          </button>

          <button id="btnHint" onclick="toggleHint()" class="btn-3d bg-sky-600 hover:bg-sky-500 text-white font-extrabold px-5 py-3.5 rounded-2xl flex items-center gap-2 text-sm sm:text-base shadow-[0_5px_0_#0369a1] cursor-pointer">
            <i class="fa-solid fa-lightbulb text-amber-200"></i>
            <span id="btnHintText">GỢI Ý</span>
          </button>

          <button id="btnReveal" onclick="revealAnswer()" class="btn-3d bg-gradient-to-r from-amber-300 via-amber-400 to-orange-500 hover:brightness-105 text-slate-950 font-black px-7 sm:px-9 py-3.5 rounded-2xl flex items-center gap-2.5 text-base sm:text-lg shadow-[0_5px_0_#b45309,0_0_25px_rgba(251,191,36,0.4)] cursor-pointer">
            <i class="fa-solid fa-wand-magic-sparkles"></i>
            <span>MỞ ĐÁP ÁN</span>
          </button>
        </div>

        <!-- Nút Câu tiếp theo -->
        <button id="btnNext" onclick="nextQuestion()" class="btn-3d bg-emerald-500 hover:bg-emerald-400 disabled:opacity-35 disabled:pointer-events-none text-slate-950 font-extrabold px-5 sm:px-6 py-3.5 rounded-2xl flex items-center gap-2 text-sm sm:text-base shadow-[0_5px_0_#047857] cursor-pointer">
          <span id="btnNextText">Câu tiếp theo</span>
          <i id="btnNextIcon" class="fa-solid fa-arrow-right"></i>
        </button>
      </div>

    </section>
  </main>

  <!-- ==================== JAVASCRIPT LOGIC ==================== -->
  <script>
    // 1. DỮ LIỆU 5 TỪ KHÓA ĐÃ CHỐT
    const QUESTIONS = [
      {
        id: 1,
        answer: "CĂNG TIN",
        hint: "Thiên đường giờ ra chơi"
      },
      {
        id: 2,
        answer: "NGỦ GẬT",
        hint: "Đặc sản tiết 4, tiết 5"
      },
      {
        id: 3,
        answer: "HỌC TỦ",
        hint: "Chiến thuật mùa thi"
      },
      {
        id: 4,
        answer: "QUAY CÓP",
        hint: "Nghệ thuật phòng thi đầy kịch tính"
      },
      {
        id: 5,
        answer: "RA CHƠI",
        hint: "Khoảnh khắc mong chờ nhất"
      }
    ];

    // 2. TRẠNG THÁI TRÒ CHƠI
    let currentIndex = 0;
    let isSolved = false;
    let isHintVisible = false;
    let currentScrambledLetters = [];

    // 3. HỆ THỐNG ÂM THANH WEB AUDIO API
    let soundEnabled = true;
    let audioCtx = null;

    function initAudio() {
      if (!audioCtx) {
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        if (AudioContext) audioCtx = new AudioContext();
      }
      if (audioCtx && audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
    }

    function playSound(type) {
      if (!soundEnabled) return;
      try {
        initAudio();
        if (!audioCtx) return;

        const now = audioCtx.currentTime;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);

        if (type === 'click') {
          osc.type = 'sine';
          osc.frequency.setValueAtTime(600, now);
          osc.frequency.exponentialRampToValueAtTime(850, now + 0.08);
          gain.gain.setValueAtTime(0.12, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.08);
          osc.start(now);
          osc.stop(now + 0.08);
        } else if (type === 'shuffle') {
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(280, now);
          osc.frequency.exponentialRampToValueAtTime(520, now + 0.18);
          gain.gain.setValueAtTime(0.1, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.18);
          osc.start(now);
          osc.stop(now + 0.18);
        } else if (type === 'win') {
          const notes = [523.25, 659.25, 783.99, 1046.50]; // C5, E5, G5, C6
          notes.forEach((freq, idx) => {
            const o = audioCtx.createOscillator();
            const g = audioCtx.createGain();
            o.type = 'triangle';
            o.connect(g);
            g.connect(audioCtx.destination);
            const t = now + idx * 0.09;
            o.frequency.setValueAtTime(freq, t);
            g.gain.setValueAtTime(0.18, t);
            g.gain.exponentialRampToValueAtTime(0.001, t + 0.35);
            o.start(t);
            o.stop(t + 0.35);
          });
        }
      } catch (err) {
        // Bỏ qua nếu trình duyệt chặn tự động phát âm thanh
      }
    }

    function toggleSound() {
      soundEnabled = !soundEnabled;
      const icon = document.getElementById('soundIcon');
      const text = document.getElementById('soundText');
      const btn = document.getElementById('btnSound');

      if (soundEnabled) {
        icon.className = 'fa-solid fa-volume-high';
        text.textContent = 'Âm thanh';
        btn.classList.remove('text-slate-400');
        btn.classList.add('text-cyan-300');
        playSound('click');
      } else {
        icon.className = 'fa-solid fa-volume-xmark';
        text.textContent = 'Đã tắt tiếng';
        btn.classList.remove('text-cyan-300');
        btn.classList.add('text-slate-400');
      }
    }

    // 4. CHẾ ĐỘ TOÀN MÀN HÌNH
    function toggleFullscreen() {
      playSound('click');
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(() => {});
      } else if (document.exitFullscreen) {
        document.exitFullscreen().catch(() => {});
      }
    }

    // 5. HÀM XÁO TRỘN CHỮ CÁI (ĐẢM BẢO KHÁC VỚI ĐÁP ÁN GỐC)
    function scrambleWord(phrase) {
      const cleanChars = phrase.replace(/\s+/g, '').split('');
      if (cleanChars.length <= 1) return cleanChars;

      let scrambled = [...cleanChars];
      let attempts = 0;
      const originalStr = cleanChars.join('');

      do {
        for (let i = scrambled.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [scrambled[i], scrambled[j]] = [scrambled[j], scrambled[i]];
        }
        attempts++;
      } while (scrambled.join('') === originalStr && attempts < 20);

      return scrambled;
    }

    // 6. THANH CHUYỂN NHANH GIỮA 5 CÂU HỎI
    function renderQuestionNav() {
      const nav = document.getElementById('questionNav');
      nav.innerHTML = QUESTIONS.map((q, idx) => {
        const isActive = idx === currentIndex;
        return `
          <button 
            onclick="selectQuestion(${idx})" 
            class="q-pill ${isActive ? 'active font-black' : 'text-slate-300 hover:bg-white/10 font-bold'} px-3 sm:px-4 py-1.5 rounded-xl text-xs sm:text-sm border border-transparent transition cursor-pointer">
            Câu ${q.id}
          </button>
        `;
      }).join('');
    }

    function selectQuestion(index) {
      if (index === currentIndex) return;
      playSound('click');
      loadQuestion(index);
    }

    // 7. HIỂN THỊ CÂU HỎI & XỬ LÝ THẺ CHỮ CÁI
    function loadQuestion(index) {
      currentIndex = index;
      isSolved = false;
      isHintVisible = false;
      renderQuestionNav();

      const q = QUESTIONS[currentIndex];
      const letterCount = q.answer.replace(/\s+/g, '').length;

      // Cập nhật nhãn số câu hỏi & số chữ cái
      document.getElementById('badgeQuestionNum').textContent = `CÂU ${currentIndex + 1} / ${QUESTIONS.length}`;
      document.getElementById('badgeLetterCount').textContent = `Từ khóa gồm ${letterCount} chữ cái`;

      // Ẩn gợi ý và banner chúc mừng
      document.getElementById('hintBox').classList.add('hidden');
      document.getElementById('hintText').textContent = q.hint;
      document.getElementById('btnHintText').textContent = 'GỢI Ý';
      document.getElementById('solvedBanner').classList.add('hidden');

      // Mở khóa nút Xáo trộn & Mở đáp án
      const btnShuffle = document.getElementById('btnShuffle');
      const btnReveal = document.getElementById('btnReveal');
      btnShuffle.disabled = false;
      btnShuffle.classList.remove('opacity-40', 'pointer-events-none');
      btnReveal.disabled = false;
      btnReveal.classList.remove('opacity-40', 'pointer-events-none');

      // Cập nhật nút điều hướng Trước / Tiếp theo
      document.getElementById('btnPrev').disabled = (currentIndex === 0);
      const btnNext = document.getElementById('btnNext');
      const btnNextText = document.getElementById('btnNextText');
      if (currentIndex === QUESTIONS.length - 1) {
        btnNext.disabled = true;
        btnNextText.textContent = 'Câu cuối cùng';
      } else {
        btnNext.disabled = false;
        btnNextText.textContent = 'Câu tiếp theo';
      }

      // Xáo trộn và vẽ các thẻ chữ cái
      currentScrambledLetters = scrambleWord(q.answer);
      renderScrambledTiles(currentScrambledLetters);
    }

    function renderScrambledTiles(letters) {
      const container = document.getElementById('lettersContainer');
      container.innerHTML = letters.map((char, idx) => `
        <div style="animation-delay: ${idx * 45}ms" class="letter-tile animate-pop-in flex-1 max-w-[116px] aspect-[4/5] rounded-2xl flex items-center justify-center">
          <span class="text-3xl sm:text-5xl md:text-6xl lg:text-7xl font-black text-cyan-300 tracking-tight drop-shadow-[0_2px_10px_rgba(56,189,248,0.4)]">${char}</span>
        </div>
      `).join('');
    }

    function reshuffleCurrent() {
      if (isSolved) return;
      playSound('shuffle');
      const q = QUESTIONS[currentIndex];
      currentScrambledLetters = scrambleWord(q.answer);
      renderScrambledTiles(currentScrambledLetters);
    }

    function toggleHint() {
      playSound('click');
      const hintBox = document.getElementById('hintBox');
      const btnHintText = document.getElementById('btnHintText');
      isHintVisible = !isHintVisible;

      if (isHintVisible) {
        hintBox.classList.remove('hidden');
        btnHintText.textContent = 'ẨN GỢI Ý';
      } else {
        hintBox.classList.add('hidden');
        btnHintText.textContent = 'GỢI Ý';
      }
    }

    function revealAnswer() {
      if (isSolved) return;
      isSolved = true;
      playSound('win');

      const q = QUESTIONS[currentIndex];
      const words = q.answer.split(' ');
      const container = document.getElementById('lettersContainer');

      // Hiển thị các từ nằm gọn trên 1 hàng ngang duy nhất, có khoảng cách rõ ràng giữa các tiếng
      let tileDelay = 0;
      container.innerHTML = words.map((word, wIdx) => {
        const wordTiles = word.split('').map(char => {
          const html = `
            <div style="animation-delay: ${tileDelay * 55}ms" class="letter-tile solved animate-pop-in w-12 sm:w-20 md:w-24 lg:w-28 aspect-[4/5] rounded-2xl flex items-center justify-center shrink">
              <span class="text-3xl sm:text-5xl md:text-6xl lg:text-7xl font-black">${char}</span>
            </div>
          `;
          tileDelay++;
          return html;
        }).join('');

        const marginClass = wIdx > 0 ? 'ml-3 sm:ml-6 md:ml-8' : '';
        return `<div class="flex items-center gap-1.5 sm:gap-3 ${marginClass}">${wordTiles}</div>`;
      }).join('');

      // Hiện thông báo chúc mừng & gợi ý
      document.getElementById('solvedBanner').classList.remove('hidden');
      document.getElementById('hintBox').classList.remove('hidden');

      // Vô hiệu hóa nút xáo trộn và mở đáp án
      const btnShuffle = document.getElementById('btnShuffle');
      const btnReveal = document.getElementById('btnReveal');
      btnShuffle.disabled = true;
      btnShuffle.classList.add('opacity-40', 'pointer-events-none');
      btnReveal.disabled = true;
      btnReveal.classList.add('opacity-40', 'pointer-events-none');

      // Bắn pháo giấy chúc mừng
      fireMiniConfetti();
    }

    function prevQuestion() {
      if (currentIndex > 0) {
        playSound('click');
        loadQuestion(currentIndex - 1);
      }
    }

    function nextQuestion() {
      if (currentIndex < QUESTIONS.length - 1) {
        playSound('click');
        loadQuestion(currentIndex + 1);
      }
    }

    function fireMiniConfetti() {
      if (typeof confetti === 'function') {
        confetti({
          particleCount: 95,
          spread: 75,
          origin: { y: 0.65 },
          colors: ['#facc15', '#38bdf8', '#34d399', '#fb7185']
        });
      }
    }

    // 8. PHÍM TẮT CHO GIÁO VIÊN KHI TRÌNH CHIẾU
    document.addEventListener('keydown', (e) => {
      if (e.code === 'Enter') {
        e.preventDefault();
        if (!isSolved) {
          revealAnswer();
        } else if (currentIndex < QUESTIONS.length - 1) {
          nextQuestion();
        }
      } else if (e.code === 'ArrowRight') {
        nextQuestion();
      } else if (e.code === 'ArrowLeft') {
        prevQuestion();
      }
    });

    // Khởi chạy ngay Câu 1 khi mở trang
    window.addEventListener('DOMContentLoaded', () => {
      loadQuestion(0);
    });
  </script>
</body>
</html>
